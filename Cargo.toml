[workspace]
resolver = "2"
members = ["crates/tessera-core", "crates/tessera-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
