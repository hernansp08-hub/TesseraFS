# Publica una versión al subir su etiqueta (git push --follow-tags tras "bun run release").
# Lanzado a mano (Actions › Publicar versión › Run workflow) hace una prueba: compila y empaqueta
# la rama elegida y deja los zips como artefacto del flujo, sin publicar nada.
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # El bun.exe de la edición portable es el que instala este paso: se fija la versión probada
  BUN_VERSION: 1.3.14
  CARGO_TERM_COLOR: always

jobs:
  empaquetar:
    name: Compilar, probar y empaquetar
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con la versión de package.json (v$v)" }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependencias del workspace
        run: bun install --frozen-lockfile

      - name: Dependencias de la app de escritorio (CLI de Tauri)
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Construir la interfaz
        run: bun run ui:build

      - name: Pruebas de TypeScript
        run: bun test

      - name: Pruebas de Rust
        run: cargo test --workspace --release

      - name: Empaquetar y publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run package --publish

      - name: Empaquetar (prueba, sin publicar)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: bun run package

      - name: Guardar los zips como artefacto del flujo
        uses: actions/upload-artifact@v4
        with:
          name: tesserafs-${{ github.ref_name }}
          path: |
            dist/release/*/*.zip
            dist/release/*/SHA256SUMS.txt
            dist/release/*/NOTAS.md
          retention-days: 7
