<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TesseraFS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='13' height='22' rx='1.6' fill='%23d9864a'/%3E%3Crect x='15' y='1' width='8' height='11' rx='1.4' fill='%235a8be6'/%3E%3Crect x='15' y='13' width='8' height='5' rx='1.2' fill='%234fae79'/%3E%3Crect x='15' y='19' width='3.5' height='4' rx='1' fill='%23c56aae'/%3E%3Crect x='19.5' y='19' width='3.5' height='4' rx='1' fill='%23b3a244'/%3E%3C/svg%3E">
<style>/*FONTS*/</style>
<style>/*STYLE*/</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="13" height="22" rx="1.6" fill="#d9864a"/><rect x="15" y="1" width="8" height="11" rx="1.4" fill="#5a8be6"/><rect x="15" y="13" width="8" height="5" rx="1.2" fill="#4fae79"/><rect x="15" y="19" width="3.5" height="4" rx="1" fill="#c56aae"/><rect x="19.5" y="19" width="3.5" height="4" rx="1" fill="#b3a244"/></svg>
      <span class="word">Tessera<b>FS</b></span>
      <span class="proto" id="editionTag"></span>
    </div>
    <button class="vol" id="volBtn" type="button" aria-haspopup="menu">
      <span class="drive" id="volLetter">C:</span>
      <span class="vol-txt">
        <span class="vol-name"><span id="volName">—</span><span id="volPct"></span></span>
        <span class="meter" aria-hidden="true"><i class="used" id="volMeter" style="width:0"></i></span>
        <span class="vol-sub" id="volSub" data-i18n="header.drive.choose">Choose a drive</span>
      </span>
      <svg class="i" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg>
    </button>
    <button class="btn primary" id="scanBtn" type="button"><svg class="i" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg><span data-i18n="header.scan">Scan</span></button>
    <div class="scan-stat"><span class="pill" id="enginePill" hidden></span><span id="scanTxt"></span></div>
    <button class="elev" id="elevBtn" type="button" hidden data-i18n-title="header.elevate.title"><svg class="i" viewBox="0 0 16 16"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg><span data-i18n="header.elevate">Fast mode</span></button>
    <div class="search-wrap">
      <label class="search" for="q">
        <svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <input id="q" type="search" data-i18n-placeholder="header.filter.placeholder" data-i18n-aria="header.filter.placeholder" autocomplete="off" spellcheck="false">
        <kbd data-i18n="key.ctrlK">Ctrl K</kbd>
        <button class="icon-btn sm" id="qHelpBtn" type="button" aria-expanded="false" aria-controls="qHelp" data-i18n-title="header.filter.help">?</button>
      </label>
      <div class="qhelp" id="qHelp" hidden>
        <p data-i18n-html="help.intro"></p>
        <button type="button" data-q="ext:gguf,safetensors"><code>ext:gguf,safetensors</code><span data-i18n="help.ex.models"></span></button>
        <button type="button" data-q="size:>1g"><code>size:&gt;1g</code><span data-i18n="help.ex.big"></span></button>
        <button type="button" data-q="age:>2y size:>100m"><code>age:&gt;2y size:&gt;100m</code><span data-i18n="help.ex.oldBig"></span></button>
        <button type="button" data-q="ext:rlib OR ext:pdb"><code>ext:rlib OR ext:pdb</code><span data-i18n="help.ex.build"></span></button>
        <button type="button" data-q="type:dir name:node_modules"><code>type:dir name:node_modules</code><span data-i18n="help.ex.nodeModules"></span></button>
        <button type="button" data-q="-ext:dll size:>500m"><code>-ext:dll size:&gt;500m</code><span data-i18n="help.ex.notDll"></span></button>
        <button type="button" data-q="path:Downloads ext:msi,exe,iso"><code>path:Downloads ext:msi,exe,iso</code><span data-i18n="help.ex.downloads"></span></button>
        <button type="button" data-q="re:^VT[._]"><code>re:^VT[._]</code><span data-i18n="help.ex.regex"></span></button>
      </div>
    </div>
    <div class="top-tools">
      <button class="icon-btn" id="langBtn" type="button" aria-haspopup="menu" data-i18n-title="header.language" data-i18n-aria="header.language"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.8 1.7 2.6 3.7 2.6 6S9.8 12.3 8 14M8 2C6.2 3.7 5.4 5.7 5.4 8s.8 4.3 2.6 6"/></svg></button>
      <button class="icon-btn" id="themeBtn" type="button"></button>
      <button class="btn ghost" id="notesBtn" type="button"><svg class="i" viewBox="0 0 16 16"><path d="M3 2.5h7.5a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2z"/><path d="M3 11.5a2 2 0 0 1 2-2h7.5"/></svg><span data-i18n="header.guide">Guide</span></button>
    </div>
    <div class="scan-bar" id="scanBar" hidden><i></i></div>
  </header>

  <main class="work">
    <section class="pane tree-pane" data-i18n-aria="pane.explorer">
      <div class="pane-head">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" type="button" data-tab="tree" aria-selected="true"><span data-i18n="tab.tree">Folders</span></button>
          <button class="tab" role="tab" type="button" data-tab="files" aria-selected="false"><span data-i18n="tab.files">Files</span> <span class="count" id="filesCount"></span></button>
          <button class="tab" role="tab" type="button" data-tab="clean" aria-selected="false"><span data-i18n="tab.clean">Free up space</span> <span class="count" id="cleanCount"></span></button>
        </div>
      </div>
      <div class="view" id="view-tree">
        <div class="tbl tbl-tree">
          <div class="thead" id="treeHead">
            <button type="button" class="c-name" data-sort="name" data-i18n="tree.col.name">Name</button>
            <button type="button" class="c-size r" data-sort="size" data-i18n="tree.col.size">Size</button>
            <span class="c-pct r" data-i18n="tree.col.pct">%</span>
            <button type="button" class="c-alloc r" data-sort="alloc" data-i18n="tree.col.alloc">On disk</button>
            <button type="button" class="c-items r" data-sort="files" data-i18n="tree.col.items">Items</button>
            <button type="button" class="c-mod r" data-sort="mtime" data-i18n="tree.col.modified">Modified</button>
          </div>
          <div class="tbody" id="treeBody" role="treegrid" tabindex="0" data-i18n-aria="tree.aria"></div>
        </div>
      </div>
      <div class="view" id="view-files" hidden>
        <div class="files-meta" id="filesMeta"></div>
        <div class="tbl tbl-files">
          <div class="thead"><span class="c-name" data-i18n="files.col.name">Name</span><span class="c-path" data-i18n="files.col.folder">Folder</span><span class="c-size r" data-i18n="files.col.size">Size</span><span class="c-mod r" data-i18n="files.col.modified">Modified</span></div>
          <div class="tbody" id="filesBody" role="grid" tabindex="0" data-i18n-aria="files.aria"></div>
        </div>
      </div>
      <div class="view" id="view-clean" hidden><div class="clean" id="cleanBody"></div></div>
    </section>
    <div class="split" id="split1" role="separator" aria-orientation="vertical" data-i18n-aria="split.tree" tabindex="0" data-i18n-title="split.title"></div>

    <section class="pane map-pane" data-i18n-aria="map.pane">
      <div class="pane-head">
        <nav class="crumbs" id="crumbs" data-i18n-aria="map.crumbs"></nav>
        <div class="map-tools">
          <span class="hl-chip" id="hlChip" hidden><span id="hlTxt"></span><button class="icon-btn sm" id="hlClear" type="button" data-i18n-title="map.clearHighlight"><svg class="i" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></span>
          <span class="seg" role="group" data-i18n-aria="map.color" id="colorSeg">
            <button type="button" data-color="category" aria-pressed="true" data-i18n="map.color.category">Category</button><button type="button" data-color="ext" aria-pressed="false" data-i18n="map.color.ext">Extension</button><button type="button" data-color="age" aria-pressed="false" data-i18n="map.color.age">Age</button>
          </span>
          <span class="seg" role="group" data-i18n-aria="map.style" id="styleSeg">
            <button type="button" data-style="mosaic" aria-pressed="true" data-i18n-title="map.style.mosaic.title" data-i18n="map.style.mosaic">Mosaic</button><button type="button" data-style="relief" aria-pressed="false" data-i18n-title="map.style.relief.title" data-i18n="map.style.relief">Relief</button>
          </span>
          <button class="icon-btn" id="labelsBtn" type="button" aria-pressed="true" data-i18n-title="map.labels"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 4h7M6 4v8.5M9.5 8h4M11.5 8v4.5"/></svg></button>
          <button class="icon-btn" id="upBtn" type="button" data-i18n-title="map.up"><svg class="i" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button>
        </div>
      </div>
      <div class="map-wrap" id="mapWrap">
        <canvas id="map"></canvas>
        <canvas id="overlay" data-i18n-aria="map.aria"></canvas>
        <canvas id="snap" hidden></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="map-state" id="mapState" hidden></div>
      </div>
    </section>
    <div class="split" id="split2" role="separator" aria-orientation="vertical" data-i18n-aria="split.rail" tabindex="0" data-i18n-title="split.title"></div>
    <div class="split row" id="split3" role="separator" aria-orientation="horizontal" data-i18n-aria="split.railHeight" tabindex="0" data-i18n-title="split.title"></div>

    <aside class="rail">
      <section class="card insp" id="insp" aria-live="polite"></section>
      <section class="card exts">
        <div class="card-head"><h2 id="compTitle"></h2><span id="extScope"></span></div>
        <div class="ext-list" id="extList"></div>
      </section>
    </aside>
  </main>

  <footer class="status">
    <span id="st1"></span><span id="st2"></span>
    <span class="st3" id="st3"></span>
  </footer>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="notes" id="notes" role="dialog" aria-modal="true" aria-labelledby="notesTitle" hidden>
  <button class="icon-btn notes-close" id="notesClose" type="button" data-i18n-title="guide.close"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  <h2 id="notesTitle" data-i18n="guide.title"></h2>
  <p class="lede" data-i18n="guide.lede"></p>
  <h3 data-i18n="guide.find.title"></h3>
  <ul>
    <li data-i18n-html="guide.find.1"></li>
    <li data-i18n-html="guide.find.2"></li>
    <li data-i18n-html="guide.find.3"></li>
    <li data-i18n-html="guide.find.4"></li>
  </ul>
  <h3 data-i18n="guide.filter.title"></h3>
  <div class="tscroll"><table>
    <thead><tr><th data-i18n="guide.filter.colType"></th><th data-i18n="guide.filter.colFinds"></th></tr></thead>
    <tbody>
      <tr><td><code>ext:gguf,bin</code></td><td data-i18n-html="guide.filter.ext"></td></tr>
      <tr><td><code>size:&gt;1g</code> · <code>size:1g..5g</code></td><td data-i18n-html="guide.filter.size"></td></tr>
      <tr><td><code>age:&gt;1y</code> · <code>age:&lt;30d</code></td><td data-i18n-html="guide.filter.age"></td></tr>
      <tr><td><code>path:Downloads</code></td><td data-i18n-html="guide.filter.path"></td></tr>
      <tr><td><code>name:VT*</code> · <code>re:^VT</code></td><td data-i18n-html="guide.filter.name"></td></tr>
      <tr><td><code>type:dir</code></td><td data-i18n-html="guide.filter.type"></td></tr>
      <tr><td><code>a OR b</code> · <code>-x</code></td><td data-i18n-html="guide.filter.or"></td></tr>
    </tbody>
  </table></div>
  <p data-i18n-html="guide.filter.aliases"></p>
  <h3 data-i18n="guide.speed.title"></h3>
  <ul>
    <li data-i18n-html="guide.speed.1"></li>
    <li data-i18n-html="guide.speed.2"></li>
    <li data-i18n-html="guide.speed.3"></li>
  </ul>
  <h3 data-i18n="guide.keys.title"></h3>
  <div class="keys">
    <kbd data-i18n="key.ctrlK"></kbd><span data-i18n="guide.key.filter"></span>
    <kbd>↑ ↓</kbd><span data-i18n="guide.key.move"></span>
    <kbd>→ ←</kbd><span data-i18n="guide.key.expand"></span>
    <kbd data-i18n="key.enter"></kbd><span data-i18n="guide.key.enter"></span>
    <kbd data-i18n="key.backspace"></kbd><span data-i18n="guide.key.up"></span>
    <kbd>1 2 3</kbd><span data-i18n="guide.key.colors"></span>
    <kbd data-i18n="key.delete"></kbd><span data-i18n="guide.key.trash"></span>
    <kbd>Esc</kbd><span data-i18n="guide.key.esc"></span>
  </div>
</aside>
<script>/*SCRIPT*/</script>
</body>
</html>
